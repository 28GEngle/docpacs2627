<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controller Game</title>
    <script src="game.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="controllerStatus">
        <p style="display: inline;">Controller: </p><p style="display: inline;" id="controller">Not Detected</p>
    </div>
    <div id="scoreLabel">
        <p style="display: inline;">Score: </p><p style="display: inline;" id="score">0</p>
    </div>
    <div id="timeLabel">
        <p style="display: inline;">Time: </p><p style="display: inline;" id="time">0</p>
    </div>

    <button id="start" onclick="startGame()">Start Game</button>
</body>
</html>
